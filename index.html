<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pint Pace</title>
  <meta name="description" content="Generate a parody activity graphic.">
  <link rel="stylesheet" href="style.css?7">
  <script 
    defer 
    src="https://cloud.umami.is/script.js" 
    data-website-id="dd930328-bdfb-4c3d-8eec-d205e6930342">
  </script>
  
  <script src="script.js?v=7" defer></script>
</head>
<body>
  <main class="app">

    <div class="mobile-header">
      <p class="eyebrow">PERFORMATIVE ALCOHOLISM WITH</p>
      <img
          class="title-graphic"
          src="assets/PINT_PACER.png"
          alt="Pint Pacer"
        >
    </div>

    <section class="controls">
      <div class="desktop-header">
        <p class="eyebrow">PERFORMATIVE ALCOHOLISM WITH</p>
        <img
          class="title-graphic"
          src="assets/PINT_PACER.png"
          alt="Pint Pacer"
        >
        <!-- <p class="intro">Pick a type, amount and elapsed time, then download the finished PNG.</p> -->
      </div>

      <div class="field">
        <div class="field-heading">
          <label id="valueLabel" for="volume">Volume</label>

          <div class="value-controls">
            <output id="volumeValue">750 ml</output>
            <button id="lessVolume" class="range-more" type="button">−</button>
            <button id="moreVolume" class="range-more" type="button">+</button>
          </div>
        </div>

        <input id="volume" type="range" min="0" max="3000" step="1" value="750">
      </div>

      <div class="field">
        <div class="field-heading">
          <label for="time">Time</label>

          <div class="value-controls">
            <output id="timeValue">5m 00s</output>
            <button id="lessTime" class="range-more" type="button">−</button>
            <button id="moreTime" class="range-more" type="button">+</button>
          </div>
        </div>

        <input id="time" type="range" min="0" max="1800" step="1" value="300">
      </div>

      <div class="field">
        <label for="modeSelect">Type</label>

        <div class="select-wrap">
          <select id="modeSelect">
            <option value="beer">Pint</option>
            <option value="wine">Wine</option>
            <option value="bottle">Bottle</option>
            <option value="shot">Shot</option>
            <option value="guinness">Guinness</option>
            <option value="silva">Silva Bumpa</option>
            <option value="girl">Girl</option>
            <option value="boy">Boy</option>
          </select>
        </div>
      </div>

      <button id="downloadButton" class="download" type="button">Download PNG</button>

      <iframe data-tally-src="https://tally.so/embed/bZVQB6?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1" loading="lazy" width="100%" height="174" frameborder="0" marginheight="0" marginwidth="0" title="Suggestions"></iframe>
      <script>var d=document,w="https://tally.so/widgets/embed.js",v=function(){"undefined"!=typeof Tally?Tally.loadEmbeds():d.querySelectorAll("iframe[data-tally-src]:not([src])").forEach((function(e){e.src=e.dataset.tallySrc}))};if("undefined"!=typeof Tally)v();else if(d.querySelector('script[src="'+w+'"]')==null){var s=d.createElement("script");s.src=w,s.onload=v,s.onerror=v,d.body.appendChild(s);}</script>
      
      <p id="status" class="status" role="status">Loading assets…</p>
    </section>

    <section class="preview-panel" aria-label="Generated image preview">
      <div class="preview-frame">
        <canvas id="preview"></canvas>
      </div>
    </section>
  </main>

  <footer>Unofficial parody. Please don't sue me Strava.</footer>
  <script>
  var d=document,w="https://tally.so/widgets/embed.js"

  if(typeof Tally!=="undefined") v();

    var s=d.createElement("script");
    s.src=w;
    s.onload=v;
    s.onerror=v;
    d.body.appendChild(s);
  }
  </script>
</body>
</html>
